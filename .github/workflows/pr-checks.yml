name: Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # ==================== PR VALIDATION ====================
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR title format
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|style|refactor|perf|test|chore|ci)(\(.+\))?: ]]; then
            echo "❌ PR title must follow conventional commits format:"
            echo "   feat: add new feature"
            echo "   fix: bug fix"
            echo "   docs: documentation changes"
            echo "   style: code style changes"
            echo "   refactor: code refactoring"
            echo "   perf: performance improvements"
            echo "   test: add or update tests"
            echo "   chore: maintenance tasks"
            echo "   ci: CI/CD changes"
            exit 1
          fi
          echo "✅ PR title format is valid"

      - name: Check PR description
        run: |
          PR_BODY="${{ github.event.pull_request.body }}"
          if [ -z "$PR_BODY" ]; then
            echo "❌ PR description is required"
            exit 1
          fi
          echo "✅ PR description exists"

      - name: Check for breaking changes
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E "(schema.prisma|package.json)" && echo "⚠️  Potential breaking changes detected" || echo "✅ No breaking changes detected"

  # ==================== CODE QUALITY ====================
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check for console.log statements
        run: |
          if grep -r "console\.log" backend/src --exclude-dir=node_modules; then
            echo "⚠️  Found console.log statements. Consider using proper logging."
          else
            echo "✅ No console.log statements found"
          fi

      - name: Check for TODO comments
        run: |
          TODO_COUNT=$(grep -r "TODO" backend/src frontend/src --exclude-dir=node_modules | wc -l)
          echo "📝 Found $TODO_COUNT TODO comments"
          if [ $TODO_COUNT -gt 50 ]; then
            echo "⚠️  High number of TODO comments. Consider addressing them."
          fi

  # ==================== SIZE CHECK ====================
  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
        run: npm run build

      - name: Check bundle size
        working-directory: frontend
        run: |
          BUNDLE_SIZE=$(du -sh .next | cut -f1)
          echo "📦 Bundle size: $BUNDLE_SIZE"

  # ==================== DEPENDENCY CHECK ====================
  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for outdated dependencies
        run: |
          cd backend && npm outdated || true
          cd ../frontend && npm outdated || true

      - name: Check for duplicate dependencies
        run: |
          cd backend && npm dedupe --dry-run || true
          cd ../frontend && npm dedupe --dry-run || true
