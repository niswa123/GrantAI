services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: grantai
      POSTGRES_PASSWORD: grantai_password
      POSTGRES_DB: grantai_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
